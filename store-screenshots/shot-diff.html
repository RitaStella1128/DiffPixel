<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;box-shadow:none!important;}
:root{--bg:#0a0a12;--surface:#101019;--line:#2a2e40;--line-strong:#3a3f57;--cyan:#00d4ff;--cyan-dim:#0e2733;--diff:#ff4d6a;--diff-dim:#35131d;--text:#f1f3fa;--muted:#9aa3bb;--ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;}
body{width:600px;height:360px;overflow:hidden;background:var(--bg);position:relative;font-family:var(--ui);color:var(--text);}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.04) 1px,transparent 1px);background-size:30px 30px;}
/* difference canvas: matched=near black, mismatch=glow */
.canvas{position:absolute;left:40px;top:40px;width:520px;height:280px;background:#05050a;border:4px solid var(--line-strong);overflow:hidden;}
.m{position:absolute;background:#0c0c14;}/* matched (dark) */
.g{position:absolute;}/* mismatch glow */
.g.c{background:var(--cyan);}
.g.p{background:var(--diff);}
.g.e{outline:3px solid var(--cyan);}
.pill{position:absolute;right:54px;top:54px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--diff);background:var(--diff-dim);border:3px solid var(--diff);padding:4px 10px;}
.cap{position:absolute;left:40px;top:286px;display:flex;gap:22px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);}
.cap b{color:var(--text);font-weight:700;}
.lg{display:flex;align-items:center;gap:8px;}
.sw{width:18px;height:8px;}
</style></head><body>
<div class="grid"></div>
<div class="canvas">
  <!-- matched dark blocks -->
  <div class="m" style="left:30px;top:24px;width:180px;height:24px;"></div>
  <div class="m" style="left:30px;top:70px;width:300px;height:9px;"></div>
  <div class="m" style="left:30px;top:90px;width:250px;height:9px;"></div>
  <div class="m" style="left:30px;top:128px;width:130px;height:110px;"></div>
  <div class="m" style="left:330px;top:128px;width:150px;height:38px;"></div>
  <!-- mismatches glow -->
  <div class="g p" style="left:30px;top:24px;width:180px;height:3px;"></div>
  <div class="g p" style="left:207px;top:24px;width:3px;height:24px;"></div>
  <div class="g c" style="left:30px;top:118px;width:130px;height:3px;"></div>
  <div class="g c" style="left:30px;top:128px;width:3px;height:110px;"></div>
  <div class="g p" style="left:330px;top:166px;width:150px;height:3px;"></div>
  <div class="g e" style="left:330px;top:128px;width:150px;height:38px;background:transparent;"></div>
  <div class="pill">◑ Difference</div>
</div>
</body></html>
