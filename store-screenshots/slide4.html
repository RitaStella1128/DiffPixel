<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DiffPixel — Store slide 4</title>
<script>
  document.documentElement.lang =
    new URLSearchParams(location.search).get('lang') === 'ja' ? 'ja' : 'en';
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=block" rel="stylesheet" />
<link rel="stylesheet" href="register.css" />
<style>
  body { width: 1280px; height: 800px; }

  .bleed {
    position: absolute;
    inset: 0;
  }

  .bleed img { width: 100%; height: 100%; object-fit: cover; }

  .caption-plate {
    bottom: 56px;
    left: 56px;
    width: 470px;
    padding: 30px 34px 32px;
  }

  .caption-plate .step-number { display: block; margin-bottom: 14px; }

  .caption-plate h3 { font-size: 32px; line-height: 1.06; margin-bottom: 14px; letter-spacing: -.03em; }
  html[lang="ja"] .caption-plate h3 { font-size: 27px; line-height: 1.3; letter-spacing: -.01em; }

  .caption-plate p { color: var(--muted); font-size: 14.5px; }
</style>
</head>
<body>
  <figure class="bleed">
    <img src="../docs/home-difference.webp" alt="" />
  </figure>

  <div class="caption-plate">
    <div data-lang="en">
      <span class="step-number">03 / Difference</span>
      <h3>Let the difference speak.</h3>
      <p>Switch blend modes. Matching pixels recede; the places that need attention remain unmistakably visible.</p>
    </div>
    <div data-lang="ja">
      <span class="step-number">03 / 差分</span>
      <h3>差分だけを、浮かび上がらせる。</h3>
      <p>合成モードを切り替えると、一致部分は後退し、修正すべき箇所だけが明確に残ります。</p>
    </div>
  </div>

  <div class="canvas-grain"></div>
</body>
</html>
