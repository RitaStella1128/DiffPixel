<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DiffPixel — Store slide 2</title>
<script>
  document.documentElement.lang =
    new URLSearchParams(location.search).get('lang') === 'ja' ? 'ja' : 'en';
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=block" rel="stylesheet" />
<link rel="stylesheet" href="register.css" />
<style>
  body { width: 1280px; height: 800px; }

  .bleed {
    position: absolute;
    inset: 0;
  }

  .bleed img { width: 100%; height: 100%; object-fit: cover; }

  .caption-plate {
    bottom: 56px;
    left: 56px;
    width: 470px;
    padding: 30px 34px 32px;
  }

  .caption-plate .step-number { display: block; margin-bottom: 14px; }

  .caption-plate h3 { font-size: 32px; line-height: 1.06; margin-bottom: 14px; letter-spacing: -.03em; }
  html[lang="ja"] .caption-plate h3 { font-size: 27px; line-height: 1.3; letter-spacing: -.01em; }

  .caption-plate p { color: var(--muted); font-size: 14.5px; }
</style>
</head>
<body>
  <figure class="bleed">
    <img src="../docs/home-add.webp" alt="" />
  </figure>

  <div class="caption-plate">
    <div data-lang="en">
      <span class="step-number">01 / Add</span>
      <h3>Bring the reference into the page.</h3>
      <p>Choose a file, drop it, or paste it. The image stays on your device and appears exactly where the work happens.</p>
    </div>
    <div data-lang="ja">
      <span class="step-number">01 / 追加</span>
      <h3>参照画像をページへ。</h3>
      <p>ファイル選択、ドロップ、貼り付け。画像は端末内に留まり、作業しているそのページに表示されます。</p>
    </div>
  </div>

  <div class="canvas-grain"></div>
</body>
</html>
