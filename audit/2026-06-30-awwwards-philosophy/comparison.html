<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DiffPixel before and after QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #080910; color: #f4f6fb; font: 14px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 28px; font-size: 28px; }
    h2 { grid-column: 1 / -1; margin: 0; color: #00d7ff; font-size: 16px; }
    main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 36px 24px; }
    figure { margin: 0; min-width: 0; }
    img { display: block; width: 100%; height: auto; border: 1px solid #454c66; }
    figcaption { margin-top: 8px; color: #a7afc4; font-size: 12px; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>DiffPixel — Mobile QA comparison</h1>
  <main>
    <h2>English Manual / English Privacy Policy</h2>
    <figure><img src="25-manual-english-mobile.jpg" alt="English manual before" /><figcaption>Manual / Before</figcaption></figure>
    <figure><img src="after/01-manual-english-mobile.jpg" alt="English manual after" /><figcaption>Manual / After</figcaption></figure>
    <figure><img src="26-policy-english-mobile.jpg" alt="English policy before" /><figcaption>Policy / Before</figcaption></figure>
    <figure><img src="after/02-policy-english-mobile.jpg" alt="English policy after" /><figcaption>Policy / After</figcaption></figure>
    <h2>English Privacy mark / Japanese Capabilities</h2>
    <figure><img src="22-privacy-english-mobile.jpg" alt="English privacy mark before" /><figcaption>Privacy mark / Before</figcaption></figure>
    <figure><img src="after/03-home-english-privacy-mobile.jpg" alt="English privacy mark after" /><figcaption>Privacy mark / After</figcaption></figure>
    <figure><img src="14-capabilities-mobile.jpg" alt="Japanese capabilities before" /><figcaption>Capabilities / Before</figcaption></figure>
    <figure><img src="after/04-home-japanese-capabilities-mobile.jpg" alt="Japanese capabilities after" /><figcaption>Capabilities / After</figcaption></figure>
  </main>
</body>
</html>
