<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DiffPixel — Marquee promo tile 1400×560</title>
<script>
  document.documentElement.lang =
    new URLSearchParams(location.search).get('lang') === 'ja' ? 'ja' : 'en';
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=block" rel="stylesheet" />
<link rel="stylesheet" href="../store-screenshots/register.css" />
<style>
  body { width: 1400px; height: 560px; }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    height: 100%;
    padding-left: 76px;
  }

  .copy { width: 520px; flex-shrink: 0; }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
  }

  .brand-row img { width: 26px; height: 26px; }

  .brand-row span {
    font-family: "Syne", system-ui, sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.03em;
  }

  h1 { font-size: 64px; margin-bottom: 24px; }
  html[lang="ja"] h1 { font-size: 54px; }

  .lead {
    max-width: 430px;
    margin-bottom: 30px;
    color: var(--muted);
    font-size: 16px;
  }

  .visual {
    position: relative;
    flex: 1;
    height: 100%;
  }

  .instrument-frame {
    position: absolute;
    top: 50%;
    right: 48px;
    left: 60px;
    aspect-ratio: 1440 / 900;
    transform: translateY(-50%);
  }

  .frame-tag { top: -1px; right: -1px; }
</style>
</head>
<body>
  <div class="canvas-grid"></div>
  <span class="ruler-top"></span>
  <span class="ruler-left"></span>

  <div class="stage">
    <div class="copy">
      <div class="brand-row">
        <img src="../docs/icons/icon48.png" alt="" />
        <span>DiffPixel</span>
      </div>

      <h1 class="drift-title" data-lang="en" data-drift-text="See the&#10;pixel that&#10;drifted.">See the<br /><span class="accent">pixel</span> that<br />drifted.</h1>
      <h1 class="drift-title" data-lang="ja" data-drift-text="1pxのズレが、&#10;見える。"><span class="accent">1px</span>のズレが、<br />見える。</h1>

      <p class="lead" data-lang="en">Overlay the reference. Align the page. Fix the difference—without leaving Chrome.</p>
      <p class="lead" data-lang="ja">参照画像を重ね、位置を合わせ、差分を直す。Chromeを離れずに。</p>

      <div class="hud-meta" data-lang="en"><span>Free</span><span>No account</span><span>Local only</span></div>
      <div class="hud-meta" data-lang="ja"><span>無料</span><span>登録不要</span><span>ローカル動作</span></div>
    </div>

    <div class="visual">
      <figure class="instrument-frame">
        <span class="reg-mark tl"></span><span class="reg-mark tr"></span>
        <span class="reg-mark bl"></span><span class="reg-mark br"></span>
        <span class="frame-tag" data-lang="en">Difference mode</span>
        <span class="frame-tag" data-lang="ja">差分モード</span>
        <img src="../docs/home-difference.webp" alt="" />
      </figure>
    </div>
  </div>

  <div class="canvas-grain"></div>
</body>
</html>
